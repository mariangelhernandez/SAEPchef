<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>EcoMove</title>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <img id="logo" src="img/logo.png" alt="">
            <h1>EcoMove</h1>
            <div class="contadores">
                <div class="contador-esquerda">
                    <div id="contador-atividades">
                        5
                    </div>
                    <label for="">QTD atividades</label>
                </div>
                <div class="contador-direita">
                    <div id="contador-co2">
                        1.62
                    </div>
                    <label for="">Qtd CO2 (kg)</label>

                </div>
            </div>
            <div class="atividades">📊 Atividades</div>
        </div>
        <div class="principal">
            <button id="btLogin">Login</button>
            <div class="seletor-veiculos">
                <button>Bicicleta</button>
                <button>Caminhada</button>
                <button>Transporte Público</button>
            </div>
            <div id="painel-atividades">
                <div class="card-atividade">
                    ativ temporaria
                </div>
                
            </div>
            <div id="contole-paginacao">
                <button>Anterior</button>
                <button>1</button>
                <button>Próximo</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
